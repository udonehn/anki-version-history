[project]
name = "note-version-history"
version = "1.2.1"
description = "Local version history for Anki notes and note types (templates/CSS)"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "anki>=23.10",
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/note_version_history"]
omit = [
    "src/note_version_history/__init__.py",
    "src/note_version_history/scheduler.py",
    "src/note_version_history/ui/*",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py39"
